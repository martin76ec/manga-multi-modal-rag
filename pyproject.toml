[project]
name = "anime-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "martin76ec", email = "larreaamartin@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fsspec>=2026.9.0",
    "huggingface-hub>=0.30,<1.0",
    "inquirer>=3.4.1",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pyarrow>=26.0.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "rich-pixels>=3.0.1",
    "sentencepiece>=0.2.2",
    "tiktoken>=0.14.0",
    "timm>=1.0.30",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=4.44,<5",
    "typesafe-sdk>=0.7.5",
]

[project.scripts]
anime-rag = "anime_rag:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
